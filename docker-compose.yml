version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spottwit_db
    environment:
      POSTGRES_DB: spottwitdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: spottwit_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  seq:
    image: datalust/seq:latest
    container_name: spottwit_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  server:
    build:
      context: ./Spottwit.Server
      dockerfile: Dockerfile
    container_name: spottwit_server
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=spottwitdb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:5341
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
      - redis
      - seq

  client:
    build:
      context: ./spottwit.client
      dockerfile: Dockerfile
    container_name: spottwit_client
    ports:
      - "5173:5173"
    volumes:
      - ./spottwit.client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  seq_data: